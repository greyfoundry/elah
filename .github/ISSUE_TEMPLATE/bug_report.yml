name: Bug report
description: Report a reproducible defect or regression in Elah.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include credentials, private server data, or exploitable vulnerability details here.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find an equivalent report.
          required: true
        - label: This report does not disclose a suspected vulnerability or other sensitive security information.
          required: true
        - label: I removed secrets, tokens, private addresses, and personal data from all evidence.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Controller or control plane
        - Worker or world runtime
        - Velocity-facing port
        - Plugin or Folia integration
        - Management API or CLI
        - Build, CI, or developer tooling
        - Documentation
        - Unknown or cross-component
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or revision
      description: Provide a release, commit SHA, or branch and date.
      placeholder: "v0.0.1, d64e474, or main at YYYY-MM-DD"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, Java/Rust/Node versions, deployment topology, and relevant Minecraft versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the smallest deterministic sequence that demonstrates the problem.
      placeholder: |
        1. Start ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitised evidence
      description: Add concise logs, traces, screenshots, or test failures. Redact sensitive data first.
      render: shell
  - type: dropdown
    id: invariant
    attributes:
      label: Does this appear to violate a documented invariant?
      options:
        - "No"
        - "Yes"
        - Unknown
    validations:
      required: true
  - type: textarea
    id: failure_path
    attributes:
      label: Failure-path and recovery observations
      description: Describe retries, partial failure, restart behaviour, data integrity, and whether recovery succeeded.
