name: Feature request
description: Propose a capability grounded in a concrete operator or player problem.
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and proposals for this capability.
          required: true
        - label: This request describes a problem and desired outcome, not only an implementation preference.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected, what are they trying to do, and what blocks them today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behaviour and acceptance criteria.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Primary scope
      options:
        - Controller or control plane
        - Worker or world runtime
        - Velocity-facing port
        - Plugin or Folia integration
        - Management API or CLI
        - Build, CI, or developer tooling
        - Documentation
        - Cross-component or undecided
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing workflows, simpler designs, and why they are insufficient.
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: Invariants and failure modes
      description: Explain ownership, retry, persistence, recovery, compatibility, or security implications.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Link measurements, traces, prior discussion, or a minimal example where available.
  - type: textarea
    id: implementation
    attributes:
      label: Possible implementation
      description: Optional. Keep the proposal distinct from the required outcome.
