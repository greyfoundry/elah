name: Code-quality finding
description: Record maintainability, correctness-risk, testing, or design debt with concrete evidence.
title: "[Quality]: "
labels:
  - code-quality
  - needs-triage
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: This finding is more specific than a general preference or style opinion.
          required: true
        - label: This finding does not disclose a vulnerability or sensitive security weakness.
          required: true
  - type: dropdown
    id: category
    attributes:
      label: Finding category
      options:
        - Correctness risk
        - Maintainability or complexity
        - Test quality or coverage gap
        - Performance or resource use
        - Observability or diagnostics
        - API or compatibility design
        - Build or developer experience
        - Documentation-to-code drift
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Finding
      description: State the concern and why it matters.
    validations:
      required: true
  - type: textarea
    id: locations
    attributes:
      label: Exact locations
      description: List files, symbols, and relevant line numbers or revisions.
      placeholder: |
        - path/to/file:42 — SymbolName
        - commit SHA or permalink
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and impact
      description: Include a failing test, trace, measurement, duplication example, or realistic maintenance failure.
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommended direction
      description: Describe the smallest safe improvement and any trade-offs.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation strategy
      description: Explain positive, negative, and failure-path checks that would prove the finding resolved.
    validations:
      required: true
