syntax = "proto3";

package elah.control.v1;

import "control/v1/protocol.proto";

option java_multiple_files = true;
option java_outer_classname = "WorkerControlProto";
option java_package = "org.greyfoundry.elah.control.v1";

// Laboratory control-plane operations implemented by elahd.
service WorkerControlService {
  // Starts or resumes the current process session for a stable worker identity.
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);

  // Replaces the last accepted load sample for the current worker session.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

// Static capacity declared by a worker process.
message WorkerCapacity {
  uint32 cpu_cores = 1;
  uint64 memory_bytes = 2;
}

// Dynamic load reported by the worker process.
message WorkerLoad {
  uint32 player_count = 1;
  uint64 loaded_chunks = 2;
  uint64 memory_used_bytes = 3;
}

// Descriptive information supplied during worker registration.
message WorkerProfile {
  string hostname = 1;
  string minecraft_version = 2;
  WorkerCapacity capacity = 3;
}

message RegisterWorkerRequest {
  RequestContext context = 1;
  string worker_id = 2;
  string session_id = 3;
  WorkerProfile profile = 4;
}

message RegisterWorkerResponse {
  uint64 generation = 1;
  bool replaced_previous_session = 2;
}

message HeartbeatRequest {
  RequestContext context = 1;
  string worker_id = 2;
  string session_id = 3;
  uint64 sequence = 4;
  WorkerLoad load = 5;
}

message HeartbeatResponse {
  uint64 generation = 1;
  uint64 accepted_sequence = 2;
  bool duplicate = 3;
}
