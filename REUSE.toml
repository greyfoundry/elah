version = 1

[[annotations]]
path = [
  "**/*.class",
  "**/*.dll",
  "**/*.exe",
  "**/*.ico",
  "**/*.jpeg",
  "**/*.jpg",
  "**/*.json",
  "**/*.lock",
  "**/*.nbt",
  "**/*.pb",
  "**/*.png",
  "**/*.toml",
  "**/*.wasm",
  "**/*.zip",
  "pnpm-lock.yaml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Greyfoundry contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["**/*.md", "!CODE_OF_CONDUCT.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Greyfoundry contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["CODE_OF_CONDUCT.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Contributor Covenant contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["java/elah-api/src/generated/java/**/*.java"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Greyfoundry contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["lab/protocol/generated/**/*"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Greyfoundry contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [".node-version"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Greyfoundry contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
  "gradlew",
  "gradlew.bat",
  "gradle/wrapper/gradle-wrapper.jar",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2015 the original authors"
SPDX-License-Identifier = "Apache-2.0"
