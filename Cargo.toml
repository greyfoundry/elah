[workspace]
members = [
    "crates/elah-cli",
    "crates/elah-core",
    "crates/elah-observer",
    "crates/elah-protocol",
    "crates/elahd",
]
resolver = "3"

[workspace.package]
version = "0.0.4"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
prost = "0.14.4"
semver = "1.0.28"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
fastnbt = "=2.6.3"
flate2 = "=1.1.9"
lz4-java-wrc = "=0.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
thiserror = "=2.0.20"
tempfile = "=3.27.0"
